name: Dashboard CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint dashboard
        run: npm run lint

      - name: Test VM build cancellation and rollback
        run: node --test scripts/safe-next-build.test.js

      - name: Build dashboard
        run: npm run build
